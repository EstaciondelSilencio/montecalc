# Builds the MonteCalc extension for Linux and Windows, runs the tests and publishes
# the .oxt files as build artifacts (and as release assets for tags v*).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # release assets for tags

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice and its SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-dev python3-uno zip
      - name: Build
        run: make -j4
      - name: Unit tests
        run: make test
      - name: Integration test (headless LibreOffice)
        timeout-minutes: 15
        run: python3 tests/integration_test.py build/MonteCalc.oxt
      - name: Excel XLL against a mock Excel
        run: make xlltest
      - name: Name the package
        run: cp build/MonteCalc.oxt MonteCalc-linux_x86_64.oxt
      - uses: actions/upload-artifact@v4
        with:
          name: MonteCalc-linux_x86_64
          path: MonteCalc-linux_x86_64.oxt

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: lo-cache
          key: lo-msi-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lo-msi-${{ runner.os }}-
      - name: Download LibreOffice and the LibreOffice SDK (latest stable)
        shell: pwsh
        run: |
          # the main server, then mirrors; each request retried (the servers answer 502 at times)
          function Get-Page($url) {
            for ($i = 1; $i -le 4; $i++) {
              try { return Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 10 $url } catch { Write-Host "$url : $_"; Start-Sleep 20 }
            }
            return $null
          }
          $servers = "https://download.documentfoundation.org/libreoffice/stable/",
                     "https://ftp.gwdg.de/pub/tdf/libreoffice/stable/",
                     "https://mirror.cyberbits.eu/tdf/libreoffice/stable/"
          $base = $null
          foreach ($b in $servers) {
            if (Get-Page $b) { $base = $b; break }
          }
          if (-not $base) { throw "no LibreOffice download server answers" }
          Write-Host "server: $base"
          $versions = (Get-Page $base).Links.href |
            Where-Object { $_ -match '^\d+\.\d+\.\d+/$' } | ForEach-Object { $_.TrimEnd('/') } |
            Sort-Object { [version]$_ }
          $ver = $versions[-1]
          $dir = "$base$ver/win/x86_64/"
          $links = (Get-Page $dir).Links.href
          $main = $links | Where-Object { $_ -match '^LibreOffice_[\d.]+_Win_x86-64\.msi$' } | Select-Object -First 1
          $sdk  = $links | Where-Object { $_ -match '^LibreOffice_[\d.]+_Win_x86-64_sdk\.msi$' } | Select-Object -First 1
          Write-Host "LibreOffice $ver : $main, $sdk"
          # the installers: cached between runs, else from the first server that delivers them
          New-Item -ItemType Directory -Force lo-cache | Out-Null
          foreach ($f in @(@($main, "lo.msi"), @($sdk, "lo_sdk.msi"))) {
            $cached = Join-Path lo-cache $f[0]
            if (-not (Test-Path $cached)) {
              foreach ($srv in $servers) {
                $root = "$srv$ver/"
                try {
                  Invoke-WebRequest -UseBasicParsing -TimeoutSec 900 -MaximumRetryCount 2 -RetryIntervalSec 15 "${root}win/x86_64/$($f[0])" -OutFile $cached
                  break
                } catch { Write-Host "$srv : $_"; Remove-Item -ErrorAction SilentlyContinue $cached }
              }
            }
            if (-not (Test-Path $cached)) { throw "could not download $($f[0])" }
            Copy-Item $cached $f[1]
          }
          # administrative extraction (no installation needed)
          Start-Process msiexec -Wait -ArgumentList "/a", "lo.msi", "/qn", "TARGETDIR=C:\lo"
          Start-Process msiexec -Wait -ArgumentList "/a", "lo_sdk.msi", "/qn", "TARGETDIR=C:\lo"
          $program = (Get-ChildItem C:\lo -Recurse -Filter types.rdb | Where-Object { $_.Directory.Name -eq 'program' } | Select-Object -First 1).Directory.FullName
          $sdkbin  = (Get-ChildItem C:\lo -Recurse -Filter cppumaker.exe | Select-Object -First 1).Directory.FullName
          $lodir = Split-Path $program -Parent
          $sdkdir = Split-Path $sdkbin -Parent
          Write-Host "program: $program  sdk: $sdkdir"
          "LO_DIR=$($lodir -replace '\\','/')"   | Out-File -Append $env:GITHUB_ENV
          "LO_SDK_DIR=$($sdkdir -replace '\\','/')" | Out-File -Append $env:GITHUB_ENV
          "LO_PROGRAM=$program" | Out-File -Append $env:GITHUB_ENV
          $program | Out-File -Append $env:GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build-win -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DLO_DIR="%LO_DIR%" -DLO_SDK_DIR="%LO_SDK_DIR%"
        shell: cmd
      - name: Build
        run: cmake --build build-win
        shell: cmd
      - name: The extension needs no Visual C++ runtime DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem build-win -Recurse -Filter montecalc.dll | Select-Object -First 1
          $deps = dumpbin /dependents $dll.FullName | Out-String
          Write-Host $deps
          if ($deps -match "(?i)msvcp1|vcruntime1") { throw "montecalc.dll depends on the Visual C++ runtime DLLs" }
      - name: Unit tests
        run: ctest --test-dir build-win --output-on-failure
        shell: cmd
      - name: Integration test (headless LibreOffice, bundled Python)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:SOFFICE = Join-Path $env:LO_PROGRAM "soffice.exe"
          $env:UNOPKG  = Join-Path $env:LO_PROGRAM "unopkg.com"
          & (Join-Path $env:LO_PROGRAM "python.exe") -u tests/integration_test.py build-win/MonteCalc-windows_x86_64.oxt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MonteCalc-windows_x86_64
          path: build-win/MonteCalc-windows_x86_64.oxt

  excel:
    # MonteCalc for Microsoft Excel: MonteCalc-Excel-x64.xll (64-bit Office) and -x86.xll (32-bit Office)
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Build
        shell: cmd
        run: |
          cmake -S xll -B build-xll -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build-xll || exit /b 1
          copy build-xll\MonteCalc.xll MonteCalc-Excel-${{ matrix.arch }}.xll
      - name: Check the exports (names Excel registers)
        shell: pwsh
        run: |
          $e = dumpbin /exports "MonteCalc-Excel-${{ matrix.arch }}.xll" | Out-String
          foreach ($n in "xlAutoOpen", "xlAutoClose", "xlAddInManagerInfo12", "mcStart", "mc_FMC_Average", "mc_FLOsimula_Normal") {
            if ($e -notmatch "\s$n\r?\n") { throw "missing export $n" }
          }
          $count = ([regex]::Matches($e, "\smc_\w+")).Count
          Write-Host "exports ok: $count mc_ functions"
          if ($count -lt 178) { throw "only $count function exports" }
          foreach ($n in "DllGetClassObject", "DllCanUnloadNow", "mcRunInternal", "mcRunInCommand", "mcConnectRibbon") {
            if ($e -notmatch "\s$n\r?\n") { throw "missing export $n" }
          }
      - name: Test the ribbon and the windows
        shell: pwsh
        timeout-minutes: 5
        run: |
          .\build-xll\xll_win_test.exe ribbon ribbon.xml
          if ($LASTEXITCODE -ne 0) { throw "ribbon test failed" }
          [xml]$x = Get-Content ribbon.xml
          $buttons = $x.SelectNodes("//*[local-name()='button']").Count
          Write-Host "ribbon: $buttons buttons"
          if ($buttons -lt 150) { throw "only $buttons ribbon buttons" }
          foreach ($k in "results", "tornado", "wizard") {
            .\build-xll\xll_win_test.exe window $k 2
            if ($LASTEXITCODE -ne 0) { throw "window $k failed" }
          }
          # typing into a MonteCalc window although the host's loop keeps keystrokes (as Excel's does)
          .\build-xll\xll_win_test.exe keys
          if ($LASTEXITCODE -ne 0) { throw "keystrokes do not reach the MonteCalc window" }
          # live preview on worker threads: pause, resume, stop keep the completed iterations
          .\build-xll\xll_win_test.exe preview | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { throw "preview test failed: $out" }
      - uses: actions/upload-artifact@v4
        with:
          name: MonteCalc-Excel-${{ matrix.arch }}
          path: MonteCalc-Excel-${{ matrix.arch }}.xll

  release:
    # tags v* publish that tag; pushes to main (re)publish the release of the current version
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows, excel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oP '<version value="\K[^"]+' ext/description.xml)
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MonteCalc ${{ steps.version.outputs.tag }}
          body: |
            MonteCalc - Monte Carlo simulation for LibreOffice Calc (MC FLO workflow).
            Windows (64-bit): download MonteCalc-windows_x86_64.oxt, then in LibreOffice use
            Tools > Extension Manager > Add, and restart LibreOffice. The ribbon groups are in the
            MC FLO sidebar deck, the Extension tab (tabbed UI), the MC FLO toolbar and menu. See docs/WINDOWS.md.
            Microsoft Excel (2010 or later): MonteCalc-Excel-x64.xll for 64-bit Office, MonteCalc-Excel-x86.xll
            for 32-bit Office. File > Options > Add-ins > Manage Excel Add-ins > Go > Browse. See docs/EXCEL.md.
            Built from ${{ github.sha }}; tested in headless LibreOffice on Windows and Linux.
          files: |
            MonteCalc-linux_x86_64.oxt
            MonteCalc-windows_x86_64.oxt
            MonteCalc-Excel-x64.xll
            MonteCalc-Excel-x86.xll
            examples/business_case.ods
            examples/business_case.xlsx
